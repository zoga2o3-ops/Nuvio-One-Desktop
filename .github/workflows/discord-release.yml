name: Discord release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (leave empty for the latest release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check Discord webhook
        id: webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; skipping the Discord announcement."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post release to Discord
        if: steps.webhook.outputs.enabled == 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = (process.env.INPUT_TAG || "").trim();

            let release;
            if (tag) {
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = res.data;
            } else if (context.payload.release) {
              release = context.payload.release;
            } else {
              const res = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              release = res.data;
            }

            const body = (release.body || "").trim();
            const description = body.length > 3500 ? `${body.slice(0, 3500)}\n…` : body;
            const assets = (release.assets || [])
              .map((asset) => `• [${asset.name}](${asset.browser_download_url})`)
              .join("\n");

            const fields = [];
            if (assets) {
              fields.push({
                name: "Downloads",
                value: assets.slice(0, 1024),
                inline: false,
              });
            }

            const payload = {
              username: "Nuvio One",
              embeds: [
                {
                  title: `Nuvio One Desktop ${release.tag_name}`,
                  url: release.html_url,
                  description: description || "A new Nuvio One Desktop release is available.",
                  color: 0xF59E0B,
                  fields,
                  footer: { text: "Nuvio One Desktop" },
                  timestamp: release.published_at,
                },
              ],
            };

            const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
            }
